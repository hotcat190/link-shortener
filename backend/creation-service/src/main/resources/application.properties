spring.application.name=creation-service

server.address=0.0.0.0
server.port=8082

# Disable Spring Boot auto DataSource configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Sharding DataSource Configuration
datasource.shard1.url=${DATASOURCE_SHARD1_URL:jdbc:mysql://localhost:3307/url_db_1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
datasource.shard1.username=${DATASOURCE_SHARD1_USERNAME:root}
datasource.shard1.password=${DATASOURCE_SHARD1_PASSWORD:root}

datasource.shard2.url=${DATASOURCE_SHARD2_URL:jdbc:mysql://localhost:3308/url_db_2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
datasource.shard2.username=${DATASOURCE_SHARD2_USERNAME:root}
datasource.shard2.password=${DATASOURCE_SHARD2_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USER:user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASS:password}

# Features
features.cache.enabled=true
features.async.post.enabled=true

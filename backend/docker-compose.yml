services:
  # ------------------------------------------------------------
  # Microservice 1: Redirect Service (Reads)
  # ------------------------------------------------------------
  redirect-service:
    build: 
      context: ./redirect-service # Assuming code is split into folders
      dockerfile: Dockerfile
    container_name: redirect-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/url_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      FEATURES_CACHE_ENABLED: true
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ------------------------------------------------------------
  # Microservice 2: Link Creation Service (Writes/API)
  # ------------------------------------------------------------
  creation-service:
    build: 
      context: ./creation-service
      dockerfile: Dockerfile
    container_name: creation-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USER: user
      SPRING_RABBITMQ_PASS: password
      FEATURES_ASYNC_POST_ENABLED: true
      SERVER_PORT: 8082
    depends_on:
      rabbitmq:
        condition: service_started

  # ------------------------------------------------------------
  # Microservice 3: Worker/Consumer (Async Processing)
  # ------------------------------------------------------------
  link-consumer:
    build: 
      context: ./link-consumer
      dockerfile: Dockerfile
    container_name: link-consumer
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/url_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USER: user
      SPRING_RABBITMQ_PASS: password
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # ------------------------------------------------------------
  # Infrastructure Services (Unchanged structure)
  # ------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_db
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - redirect-service
      - creation-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
  
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
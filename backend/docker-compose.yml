services:
  # ------------------------------------------------------------
  # Microservice 1: Redirect Service (Reads)
  # ------------------------------------------------------------
  redirect-service:
    build: 
      context: .
      dockerfile: redirect-service/Dockerfile
    container_name: redirect-service
    environment:
      # Sharding DataSources
      DATASOURCE_SHARD1_URL: jdbc:mysql://mysql_shard_1:3306/url_db_1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD1_USERNAME: root
      DATASOURCE_SHARD1_PASSWORD: root
      DATASOURCE_SHARD2_URL: jdbc:mysql://mysql_shard_2:3306/url_db_2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD2_USERNAME: root
      DATASOURCE_SHARD2_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FEATURES_CACHE_ENABLED: true
      SERVER_PORT: 8081
    depends_on:
      mysql_shard_1:
        condition: service_healthy
      mysql_shard_2:
        condition: service_healthy
      redis:
        condition: service_started

  # ------------------------------------------------------------
  # Microservice 2: Link Creation Service (Writes/API)
  # ------------------------------------------------------------
  creation-service:
    build: 
      context: .
      dockerfile: creation-service/Dockerfile
    container_name: creation-service
    environment:
      # Sharding DataSources
      DATASOURCE_SHARD1_URL: jdbc:mysql://mysql_shard_1:3306/url_db_1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD1_USERNAME: root
      DATASOURCE_SHARD1_PASSWORD: root
      DATASOURCE_SHARD2_URL: jdbc:mysql://mysql_shard_2:3306/url_db_2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD2_USERNAME: root
      DATASOURCE_SHARD2_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USER: user
      SPRING_RABBITMQ_PASS: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FEATURES_ASYNC_POST_ENABLED: true
      SERVER_PORT: 8082
    depends_on:
      mysql_shard_1:
        condition: service_healthy
      mysql_shard_2:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # ------------------------------------------------------------
  # Microservice 3: Worker/Consumer (Async Processing)
  # ------------------------------------------------------------
  link-consumer:
    build: 
      context: .
      dockerfile: link-consumer/Dockerfile
    container_name: link-consumer
    environment:
      # Sharding DataSources
      DATASOURCE_SHARD1_URL: jdbc:mysql://mysql_shard_1:3306/url_db_1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD1_USERNAME: root
      DATASOURCE_SHARD1_PASSWORD: root
      DATASOURCE_SHARD2_URL: jdbc:mysql://mysql_shard_2:3306/url_db_2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_SHARD2_USERNAME: root
      DATASOURCE_SHARD2_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USER: user
      SPRING_RABBITMQ_PASS: password
    depends_on:
      mysql_shard_1:
        condition: service_healthy
      mysql_shard_2:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # ------------------------------------------------------------
  # Database Shards
  # ------------------------------------------------------------
  mysql_shard_1:
    image: mysql:8.0
    container_name: mysql_shard_1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_db_1
    ports:
      - "3307:3306"
    volumes:
      - ./init-shard.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_shard_1_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql_shard_2:
    image: mysql:8.0
    container_name: mysql_shard_2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_db_2
    ports:
      - "3308:3306"
    volumes:
      - ./init-shard.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_shard_2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Infrastructure Services
  # ------------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - redirect-service
      - creation-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
  
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

volumes:
  mysql_shard_1_data:
  mysql_shard_2_data:
